<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCost</title>
<style>
  /* Claude.ai 风格：米白背景 / 深色文字 / 橙色 accent / 大量留白 */
  :root {
    --bg: #f5f4ef;
    --card: #ffffff;
    --text: #1a1915;
    --muted: #8a8a85;
    --line: #e4e2db;
    --accent: #d97757;
    --accent-dark: #c05f3f;
    --chip: #f0efea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ---- 登录页：Claude 风格 ---- */
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login-mark { font-size: 40px; margin-bottom: 16px; letter-spacing: -1px; font-weight: 600; }
  .login-mark em { font-style: normal; color: var(--accent); }
  .login-sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  .login-card { width: 320px; display: flex; flex-direction: column; gap: 14px; }
  .login-card input { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--text); outline: none; transition: border-color .15s; }
  .login-card input:focus { border-color: var(--accent); }
  .login-card input::placeholder { color: #b0afa9; }
  .login-card button { background: var(--accent); border: none; color: #fff; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s; margin-top: 4px; }
  .login-card button:hover { background: var(--accent-dark); }
  .login-err { color: #c0392b; font-size: 13px; min-height: 18px; text-align: center; }

  /* ---- 看板 ---- */
  .wrap { max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 32px; }
  h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.5px; }
  h1 em { font-style: normal; color: var(--accent); }
  .head-sub { color: var(--muted); font-size: 13px; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .toolbar label { color: var(--muted); font-size: 13px; }
  .toolbar input[type="date"] { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; }
  .toolbar input[type="date"]:focus { border-color: var(--accent); }
  .quick { display: flex; gap: 6px; }
  .quick button { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: all .15s; }
  .quick button:hover { border-color: var(--accent); color: var(--accent-dark); }
  .spacer { flex: 1; }
  .logout { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px; }
  .logout:hover { color: var(--accent-dark); }
  .cur-toggle { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: all .15s; }
  .cur-toggle:hover { border-color: var(--accent); color: var(--accent-dark); }
  .cur-select { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; outline: none; }
  .cur-select:hover { border-color: var(--accent); }
  .model-link { appearance: none; background: none; border: none; padding: 0; color: var(--accent); font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
  .model-link:hover, .model-link:focus-visible { color: var(--accent-dark); text-decoration: underline; outline: none; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 36px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 10px; letter-spacing: 0.3px; }
  .card .value { font-size: 26px; font-weight: 650; letter-spacing: -0.5px; }
  .card .value small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .budget-panel { margin-top: -20px; }
  .budget-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .budget-head h2 { margin-bottom: 0; }
  .budget-text { color: var(--muted); font-size: 13px; }
  .budget-track { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; }
  .budget-track i { display: block; height: 100%; border-radius: inherit; background: #4a9d6a; transition: width .25s; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  /* ===== 移动端适配 ===== */
  @media (max-width: 768px) {
    .grid2 { grid-template-columns: 1fr; }
    .wrap { padding: 20px 14px 60px; }
    header { margin-bottom: 20px; }
    h1 { font-size: 20px; }
    .head-sub { font-size: 12px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
    .card { padding: 16px 14px; border-radius: 12px; }
    .card .label { font-size: 11px; margin-bottom: 8px; }
    .card .value { font-size: 19px; }
    .card .value small { font-size: 11px; margin-left: 2px; display: block; margin-top: 2px; }
    .toolbar { gap: 8px; margin-bottom: 18px; }
    .toolbar label { font-size: 12px; }
    .toolbar input[type="date"] { padding: 7px 8px; font-size: 12px; flex: 1; min-width: 0; }
    .quick { flex-wrap: wrap; }
    .quick button { padding: 6px 10px; font-size: 12px; }
    .cur-select { padding: 6px 8px; font-size: 12px; flex: 1; min-width: 0; }
    .logout { padding: 6px 6px; font-size: 12px; }
    .panel { padding: 16px 12px; border-radius: 12px; margin-bottom: 10px; }
    h2 { font-size: 14px; margin-bottom: 10px; }
    table { font-size: 12px; }
    th, td { padding: 7px 6px; }
    /* 表格窄屏横向滚动：容器允许横滚，表格保持最小宽度 */
    .scroll-box { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .scroll-box table { min-width: 620px; }
    /* SVG 有 viewBox 自适应，无需横滚 */
    .chart-tabs button { padding: 4px 10px; font-size: 11px; }
    .modal { padding: 20px 16px; }
    .modal .row { flex-direction: column; gap: 10px; }
  }
  .scroll-box { max-height: 300px; overflow: auto; border-radius: 8px; min-width: 0; max-width: 100%; }
  .grid2 > * { min-width: 0; }
  .panel { max-width: 100%; }
  .scroll-box::-webkit-scrollbar { width: 6px; }
  .scroll-box::-webkit-scrollbar-track { background: transparent; }
  .scroll-box::-webkit-scrollbar-thumb { background: #e0ddd4; border-radius: 3px; }
  .scroll-box::-webkit-scrollbar-thumb:hover { background: #ccc8bd; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 9px 8px; border-bottom: 1px solid #f0efea; }
  tr:last-child td { border-bottom: none; }
  .bar { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .cache-pct { font-weight: 650; font-size: 12.5px; }
  .cache-bar { height: 3px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 3px 0 2px; max-width: 80px; }
  .cache-bar i { display: block; height: 100%; border-radius: 3px; }
  .cache-price { font-size: 10.5px; line-height: 1.3; }
  .chart-tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; max-width: 100%; }
  .chart-tabs button { background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 14px; font-size: 12px; cursor: pointer; transition: all .15s; }
  .chart-tabs button:hover { border-color: var(--accent); color: var(--accent-dark); }
  .chart-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .tag-codex { background: #f3ece3; color: #9a6b3f; }
  .tag-hermes { background: #e8eef4; color: #3f6b9a; }
  .tag-claude { background: #f3e8e3; color: #9a4a3f; }
  .tag-up { background: #eef0e6; color: #6b7a3f; }
  .tag-mode { background: #efeaea; color: #8a7a7a; }
  .tag-plan { background: #e6eef0; color: #3f7a8a; }
  .num { font-variant-numeric: tabular-nums; }
  #loading { text-align: center; color: var(--muted); padding: 100px 0; }
  .err-msg { text-align: center; color: #c0392b; padding: 60px 0; }
  .muted { color: var(--muted); }
  .chart-box { position: relative; margin-bottom: 10px; }
  #chartTip { position: fixed; z-index: 999; pointer-events: none; background: #1a1915; color: #f5f4ef; border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,.18); opacity: 0; transition: opacity .12s; max-width: 260px; }
  #chartTip .tip-t { font-weight: 600; }
  #chartTip .tip-v { color: #d97757; font-weight: 600; }
  svg .hoverable { cursor: pointer; }
  svg .hoverable:hover { opacity: .75; }
  .chart-note { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  /* 设置弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(26,25,21,.4); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; }
  .modal h3 { font-size: 17px; margin-bottom: 20px; }
  .modal .field { margin-bottom: 16px; }
  .modal label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .modal input[type="number"], .modal input[type="text"], .modal input[type="password"], .modal select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text); outline: none; }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal .row { display: flex; gap: 12px; }
  .modal .row .field { flex: 1; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal button { border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .modal button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal button.primary:hover { background: var(--accent-dark); }
  .modal .hint { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
  .modal .status { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .modal .status.ok { color: #3f8a5a; }
  .modal .status.err { color: #c0392b; }
  /* 模型价格管理：表格内输入框 */
  .modal table td { vertical-align: middle; padding: 5px 8px; }
  .modal table input {
    width: 100%;
    min-width: 56px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 12.5px;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .modal table input::placeholder { color: #b9b7b0; }
  .modal table input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,119,87,.12); }
  .modal table input[type="number"]::-webkit-inner-spin-button,
  .modal table input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .modal table input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .modal .m-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 6px; transition: all .12s; }
  .modal .m-del:hover { color: #c0392b; background: #f6e9e6; }
</style>
</head>
<body>
<div id="chartTip"></div>
<div id="root"></div>

<script>
const TOKEN_KEY = 'agentcost_token';
const ROLE_KEY = 'agentcost_role';
const CURRENCY_KEY = 'agentcost_currency';
let state = { from: '', to: '', fx: 7.1, agent: '', upstream: '', model: '', user: '', cwd: '', role: '', readonly: false, filters: { agents: [], upstreams: [], models: [], projects: [], users: [] }, dim_bar: 'tokens', dim_line: 'tokens', dim_donut: 'cost', donut_group: 'model', records_offset: 0 };
let lastScanAt = null;

const DIMS = [
  {key:'tokens',label:'Tokens',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.tokens ?? 0)},
  {key:'cnt',label:'请求数',unit:'次',fmt:v=>String(v),charts:['bar','line','donut'],get:r=>Number(r.cnt ?? 0)},
  {key:'cost',label:'成本',unit:'',fmt:fmtCost,charts:['bar','line','donut'],get:r=>Number(r.cost ?? 0)},
  {key:'inp',label:'输入 token',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.inp ?? r.inp_tokens ?? 0)},
  {key:'out',label:'输出 token',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.out ?? r.out_tokens ?? 0)},
  {key:'reasoning',label:'推理 token',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.reasoning ?? r.reasoning_tokens ?? 0)},
  {key:'cr',label:'缓存读 token',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.cr ?? r.cr_tokens ?? 0)},
  {key:'cw',label:'缓存写 token',unit:'',fmt:fmtTokens,charts:['bar','line','donut','stack'],get:r=>Number(r.cw ?? r.cw_tokens ?? 0)},
  {key:'cache_rate',label:'缓存率',unit:'%',fmt:v=>fmtAxis(v)+'%',charts:['bar','line','donut'],get:r=>Number(r.cache_rate ?? 0)},
  {key:'cost_per_token',label:'成本/千token',unit:'',fmt:fmtCostAxis,charts:['bar','line','donut'],get:r=>{const t=Number(r.tokens||0);return t?Number(r.cost||0)/t*1000:0}},
  {key:'saved',label:'缓存节省',unit:'',fmt:fmtCost,charts:['bar','line','donut'],get:r=>Number(r.saved ?? r.saved_usd ?? 0)}
];
function dimDef(k){ return DIMS.find(d=>d.key===k)||DIMS[0]; }
function niceMax(v){ if (!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }

function getCurrency() { return localStorage.getItem(CURRENCY_KEY) || 'cny'; }
function setCurrency(c) { localStorage.setItem(CURRENCY_KEY, c); }
function escHtml(v) {
  return String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
/* 金额：cny 默认，usd 可切 */
function fmtCost(n, isPrice = false) {
  if (!n) return '¥0';
  const cur = getCurrency();
  if (cur === 'usd') {
    if (isPrice) return '$' + n;
    return n < 0.01 ? '<$0.01' : '$' + n.toFixed(2);
  }
  const cny = n * (state.fx || 7.1);
  if (isPrice) return '¥' + cny.toFixed(2);
  if (cny < 0.01) return '<¥0.01';
  return '¥' + (cny >= 100 ? cny.toFixed(0) : cny.toFixed(2));
}
function fmtPrice(p) { return fmtCost(p, true); }
/* Y 轴刻度：整数显示整数，小数保留两位 */
function fmtAxis(n) { return Math.round(n) === n ? String(Math.round(n)) : n.toFixed(2); }
/* 成本轴：按当前货币换算（DB 存 USD）后格式化，不带符号 */
function fmtCostAxis(n) {
  const cur = getCurrency();
  const v = cur === 'usd' ? n : n * (state.fx || 7.1);
  return fmtAxis(v);
}
function pct(n, total) { return total ? (n / total * 100) : 0; }

/* ---------- SVG 图表（带 hover） ---------- */
function bindChartHover() {
  const tip = document.getElementById('chartTip');
  document.querySelectorAll('svg .hoverable').forEach(el => {
    el.addEventListener('mousemove', e => {
      let t = el.getAttribute('data-tip');
      // 折线：整条线触发，按鼠标 x 找最近数据点
      if (el.classList.contains('line-hit')) {
        const daily = JSON.parse(el.getAttribute('data-daily') || '[]');
        if (daily.length) {
          const svg = el.closest('svg');
          const rect = svg.getBoundingClientRect();
          const vb = svg.viewBox.baseVal;
          const xRatio = (e.clientX - rect.left) / rect.width * vb.width;
          const PL = 64, iw = vb.width - 64 - 20;
          const idx = Math.max(0, Math.min(daily.length - 1, Math.round((xRatio - PL) / (iw / Math.max(1, daily.length - 1)))));
          const d = daily[idx];
          // 跟随当前激活维度（请求数/成本/Tokens）
          const panel = el.closest('.panel');
          const activeBtn = panel ? panel.querySelector('.chart-tabs button.on') : null;
          const dim = activeBtn ? activeBtn.dataset.dim : 'tokens';
          const dd=dimDef(dim), valTxt=dd.fmt(dd.get(d));
          t = `<div class="tip-t">${d.day}</div><div>${dd.label}: <span class="tip-v">${valTxt}</span></div><div>输入/输出: ${fmtTokens(d.inp||0)} / ${fmtTokens(d.out||0)}</div><div>缓存读/写: ${fmtTokens(d.cr||0)} / ${fmtTokens(d.cw||0)} · 推理: ${fmtTokens(d.reasoning||0)}</div>`;
        }
      }
      // 堆叠图的所有层共用按 X 轴取最近日期的明细提示。
      if (el.classList.contains('stack-hit')) {
        const daily = JSON.parse(el.getAttribute('data-daily') || '[]');
        if (daily.length) {
          const svg = el.closest('svg');
          const rect = svg.getBoundingClientRect();
          const vb = svg.viewBox.baseVal;
          const xRatio = (e.clientX - rect.left) / rect.width * vb.width;
          const PL = 64, iw = vb.width - 64 - 20;
          const idx = Math.max(0, Math.min(daily.length - 1, Math.round((xRatio - PL) / (iw / Math.max(1, daily.length - 1)))));
          const d = daily[idx];
          t = `<div class="tip-t">${d.day}</div>` +
            `<div>输入: <span class="tip-v">${fmtTokens(d.inp || 0)}</span></div>` +
            `<div>输出: <span class="tip-v">${fmtTokens(d.out || 0)}</span></div>` +
            `<div>缓存读: <span class="tip-v">${fmtTokens(d.cr || 0)}</span></div>` +
            `<div>缓存写: <span class="tip-v">${fmtTokens(d.cw || 0)}</span></div>` +
            `<div>推理: <span class="tip-v">${fmtTokens(d.reasoning || 0)}</span></div>` +
            `<div>总 token: <span class="tip-v">${fmtTokens(d.tokens || 0)}</span></div>`;
        }
      }
      if (!t) return;
      tip.innerHTML = t;
      tip.style.opacity = '1';
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = (e.clientX + 14 + tw > window.innerWidth ? e.clientX - tw - 14 : e.clientX + 14) + 'px';
      tip.style.top = (e.clientY + 14 + th > window.innerHeight ? e.clientY - th - 14 : e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
  });
}

function svgLineChart(daily, dim = 'tokens') {
  if (!daily || daily.length === 0) return '<div class="muted" style="padding:30px 0;text-align:center">范围内无数据</div>';
  const W = 1000, H = 300, PL = 64, PR = 20, PT = 24, PB = 44;
  const iw = W - PL - PR, ih = H - PT - PB;
  const dd=dimDef(dim), data = daily.map(x => dd.get(x));
  if (!data.some(v=>v>0)) return '<div class="muted" style="padding:30px 0;text-align:center">该维度无数据（全为0）</div>';
  const max = niceMax(Math.max(...data));
  const n = data.length;
  const stepX = n > 1 ? iw / (n - 1) : 0;
  const px = i => PL + i * stepX;
  const py = v => PT + ih - (v / max) * ih;

  let line = '', area = `M ${px(0)} ${py(data[0])} `, dots = '', labels = '';
  data.forEach((v, i) => {
    const x = px(i), y = py(v);
    line += (i === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    area += 'L ' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    const valTxt = dd.fmt(v);
    const tip = `<div class="tip-t">${daily[i].day}</div><div>${dd.label}: <span class="tip-v">${valTxt}</span></div><div>输入: ${fmtTokens(daily[i].inp||0)} · 输出: ${fmtTokens(daily[i].out||0)}</div><div>缓存读/写: ${fmtTokens(daily[i].cr||0)} / ${fmtTokens(daily[i].cw||0)} · 推理: ${fmtTokens(daily[i].reasoning||0)}</div>`;
    if(n<=60) dots += `<circle class="hoverable" data-tip="${tip.replace(/"/g, '&quot;')}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="transparent"/>`;
    if(n<=60) dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#d97757" stroke="#fff" stroke-width="1.5"><title>${daily[i].day}</title></circle>`;
    if(n<=15) dots += `<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" font-size="10" fill="#8a8a85">${valTxt}</text>`;
    if (n <= 15 || i % Math.ceil(n / 12) === 0 || i === n - 1) {
      labels += `<text x="${x.toFixed(1)}" y="${H - 14}" text-anchor="middle" font-size="11" fill="#8a8a85">${daily[i].day.slice(5)}</text>`;
    }
  });
  area += 'L ' + px(n - 1).toFixed(1) + ' ' + (PT + ih) + ' L ' + px(0).toFixed(1) + ' ' + (PT + ih) + ' Z';

  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = PT + ih - (g / 4) * ih;
    const val = max * g / 4;
    const valTxt = dd.key==='cost' || dd.key==='cost_per_token' ? fmtCostAxis(val) : dd.key==='cnt' || dd.key==='cache_rate' ? fmtAxis(val) : fmtTokens(val);
    grid += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e4e2db" stroke-width="1"/>`;
    grid += `<text x="${PL - 8}" y="${y + 3}" text-anchor="end" font-size="11" fill="#8a8a85">${valTxt}</text>`;
  }

  const dailyJson = JSON.stringify(daily).replace(/'/g, '&#39;');
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    ${grid}
    <path class="hoverable line-hit" data-daily='${dailyJson}' d="${area}" fill="rgba(217,119,87,.10)" style="pointer-events:all"/>
    <path d="${line}" fill="none" stroke="#d97757" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="hoverable line-hit" data-daily='${dailyJson}' d="${line}" fill="none" stroke="transparent" stroke-width="26" style="pointer-events:stroke"/>
    ${dots}
    ${labels}
  </svg></div>`;
}

function svgStackChart(daily) {
  if (!daily || daily.length === 0) return '<div class="muted" style="padding:30px 0;text-align:center">范围内无数据</div>';
  const W = 1000, H = 300, PL = 64, PR = 20, PT = 24, PB = 44;
  const iw = W - PL - PR, ih = H - PT - PB;
  const allLayers = [
    ['inp', '输入', '#f0c4a8'], ['out', '输出', '#d97757'], ['cw', '缓存写', '#c05f3f'],
    ['cr', '缓存读', '#e8a08a'], ['reasoning', '推理', '#9a6b3f']
  ];
  const layers = allLayers.filter(x => !(window.__stackHidden||{})[x[0]]);
  const sums = daily.map(d => layers.reduce((sum, [key]) => sum + (d[key] || 0), 0));
  const max = Math.max(...sums, 1);
  const n = daily.length, stepX = n > 1 ? iw / (n - 1) : 0;
  const px = i => PL + i * stepX;
  const py = v => PT + ih - (v / max) * ih;
  const dailyJson = JSON.stringify(daily).replace(/'/g, '&#39;');
  let grid = '', labels = '', paths = '';
  for (let g = 0; g <= 4; g++) {
    const y = PT + ih - (g / 4) * ih;
    grid += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e4e2db" stroke-width="1"/>`;
    grid += `<text x="${PL - 8}" y="${y + 3}" text-anchor="end" font-size="11" fill="#8a8a85">${fmtTokens(max * g / 4)}</text>`;
  }
  daily.forEach((d, i) => {
    if (n <= 15 || i % Math.ceil(n / 12) === 0 || i === n - 1) {
      labels += `<text x="${px(i).toFixed(1)}" y="${H - 14}" text-anchor="middle" font-size="11" fill="#8a8a85">${d.day.slice(5)}</text>`;
    }
  });
  let lower = Array(n).fill(0);
  layers.forEach(([key, label, color]) => {
    const upper = lower.map((v, i) => v + (daily[i][key] || 0));
    let path = `M ${px(0).toFixed(1)} ${py(upper[0]).toFixed(1)} `;
    upper.forEach((v, i) => { if (i) path += `L ${px(i).toFixed(1)} ${py(v).toFixed(1)} `; });
    for (let i = n - 1; i >= 0; i--) path += `L ${px(i).toFixed(1)} ${py(lower[i]).toFixed(1)} `;
    path += 'Z';
    paths += `<path class="hoverable stack-hit" data-daily='${dailyJson}' d="${path}" fill="${color}" fill-opacity=".9" stroke="#fff" stroke-width=".7"><title>${label}</title></path>`;
    lower = upper;
  });
  const legend = allLayers.map(([k,l,c],i)=>`<g class="stack-legend hoverable" data-layer="${k}" transform="translate(${PL+i*170},16)"><circle cx="0" cy="0" r="5" fill="${c}" opacity="${(window.__stackHidden||{})[k] ? '.25':'1'}"/><text x="10" y="4" font-size="11" fill="#6f6f69">${l}</text></g>`).join('');
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${legend}${grid}${paths}${labels}</svg></div>`;
}

function svgBarChart(models, dim = 'tokens') {
  if (!models || models.length === 0) return '<div class="muted" style="padding:30px 0;text-align:center">范围内无数据</div>';
  const W = 1000, H = 300, PL = 70, PR = 20, PT = 24, PB = 52;
  const iw = W - PL - PR, ih = H - PT - PB;
  const dd=dimDef(dim), data = models.map(m=>dd.get(m));
  if (!data.some(v=>v>0)) return '<div class="muted" style="padding:30px 0;text-align:center">该维度无数据（全为0）</div>';
  const max = niceMax(Math.max(...data));
  const n = data.length;
  const bw = iw / n;
  const barW = Math.max(22, Math.min(72, bw * 0.62));

  let bars = '', labels = '';
  data.forEach((v, i) => {
    const x = PL + i * bw + (bw - barW) / 2;
    const h = Math.max((v / max) * ih, 3);
    const y = PT + ih - h;
    const short = (models[i].model || '').replace(/^.*\//, '').slice(0, 14);
    const valTxt = dd.fmt(v);
    const m=models[i], tip = `<div class="tip-t">${m.model}</div><div>上游: ${m.upstream || '—'}</div><div>${dd.label}: <span class="tip-v">${valTxt}</span></div><div>输入/输出: ${fmtTokens(m.inp_tokens||m.inp||0)} / ${fmtTokens(m.out_tokens||m.out||0)}</div><div>缓存读/写: ${fmtTokens(m.cr_tokens||m.cr||0)} / ${fmtTokens(m.cw_tokens||m.cw||0)}</div><div>推理: ${fmtTokens(m.reasoning_tokens||m.reasoning||0)}</div><div>缓存率: ${(m.cache_rate||0)}% · 缓存节省: ${fmtCost(m.saved_usd||m.saved||0)}</div>`;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="#d97757" opacity=".85"/><rect class="bar-hit hoverable" data-model="${escHtml(m.model||'')}" data-tip="${tip.replace(/"/g, '&quot;')}" x="${x.toFixed(1)}" y="${PT}" width="${barW.toFixed(1)}" height="${ih.toFixed(1)}" fill="transparent" style="pointer-events:all"/>`;
    if(v>0) bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#8a8a85" font-weight="600">${dd.key==='cost'||dd.key==='cost_per_token'?fmtCostAxis(v):dd.key==='cnt'||dd.key==='cache_rate'?fmtAxis(v):fmtTokens(v)}</text>`;
    labels += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 28}" text-anchor="middle" font-size="10" fill="#8a8a85">${short}</text>`;
    labels += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${models[i].upstream || ''}</text>`;
  });

  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = PT + ih - (g / 4) * ih;
    const val = max * g / 4;
    grid += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#e4e2db" stroke-width="1"/>`;
    grid += `<text x="${PL - 8}" y="${y + 3}" text-anchor="end" font-size="11" fill="#8a8a85">${dd.key==='cost'||dd.key==='cost_per_token'?fmtCostAxis(val):dd.key==='cnt'||dd.key==='cache_rate'?fmtAxis(val):fmtTokens(val)}</text>`;
  }

  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    ${grid}
    ${bars}
    ${labels}
  </svg></div>`;
}

function svgDonutChart(items, dim = 'cost') {
  if (!items || items.length === 0) return '<div class="muted" style="padding:30px 0;text-align:center">范围内无数据</div>';
  const W = 1000, H = 320, cx = 500, cy = 160, r = 90, sw = 30;
  const dd=dimDef(dim), vals = items.map(x => Math.max(0, dd.get(x)));
  const total = vals.reduce((a, b) => a + b, 0);
  if (!total) return '<div class="muted" style="padding:30px 0;text-align:center">该维度无数据（全为0）</div>';
  const colors = ['#d97757','#e8a08a','#c05f3f','#f0c4a8','#9a6b3f','#d49a72','#b96d52','#efb99f','#a85b42','#e2b18f'];
  const circ = 2 * Math.PI * r;
  let offset = 0, segs = '', legend = '';
  vals.forEach((v, i) => {
    if (!v) return;
    const len = v / total * circ;
    const label = items[i].label || items[i].model || '—';
    const valTxt = dd.fmt(v);
    const tip = `<div class="tip-t">${label}</div><div>${dd.label}: <span class="tip-v">${valTxt}</span></div>`;
    segs += `<circle class="hoverable donut-hit" data-label="${escHtml(label)}" data-tip="${tip.replace(/"/g, '&quot;')}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="${sw}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
    legend += `<text x="650" y="${78 + i * 22}" font-size="12" fill="#6f6f69"><tspan fill="${colors[i % colors.length]}">●</tspan> ${label.slice(0, 24)} · ${Math.round(v / total * 100)}%</text>`;
  });
  const center = dd.key==='cost'||dd.key==='cost_per_token'?fmtCostAxis(total):dd.key==='cnt'?String(Math.round(total)):dd.fmt(total);
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eeeae2" stroke-width="${sw}"/>${segs}<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="24" font-weight="600" fill="#3d3d39">${center}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="12" fill="#8a8a85">${dd.label}</text>${legend}</svg></div>`;
}

function bindChartTabs() {
  document.querySelectorAll('.chart-tabs').forEach(tabs => {
    tabs.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        const dim = btn.dataset.dim;
        const container = tabs.closest('.panel');
        tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
        const chartBox = container.querySelector('.chart-box');
        const isBar = container.id === 'barPanel';
        const isDonut = container.id === 'donutPanel';
        if(isBar) state.dim_bar=dim; else if(isDonut) state.dim_donut=dim; else state.dim_line=dim;
        const newHtml = isBar ? svgBarChart(window.__barData || [], dim) : isDonut ? svgDonutChart(window.__activeDonutData || [], dim) : svgLineChart(window.__lineData || [], dim);
        // 提取纯 svg 替换，避免 chart-box 嵌套
        const m = newHtml.match(/<svg[\s\S]*<\/svg>/);
        if (chartBox) { if (m) chartBox.innerHTML = m[0]; else chartBox.innerHTML = newHtml; }
        bindChartHover();
        bindChartClicks();
      };
    });
  });
}
function bindChartClicks(){
  document.querySelectorAll('.bar-hit').forEach(el=>el.addEventListener('click',()=>{ state.model=el.dataset.model; const s=document.getElementById('filterModel'); if(s) s.value=state.model; load(); }));
  document.querySelectorAll('.donut-hit').forEach(el=>el.addEventListener('click',()=>{ const g=state.donut_group||'model'; if(g==='model'){state.model=el.dataset.label; const s=document.getElementById('filterModel'); if(s)s.value=state.model;} else if(g==='upstream'){state.upstream=el.dataset.label; const s=document.getElementById('filterUp'); if(s)s.value=state.upstream;} else if(g==='user'){state.user=el.dataset.label; const s=document.getElementById('filterUser'); if(s)s.value=state.user;} else if(g==='project'){state.cwd=el.dataset.label; const s=document.getElementById('filterProject'); if(s)s.value=state.cwd;} else {state.agent=el.dataset.label; const s=document.getElementById('filterAgent'); if(s)s.value=state.agent;} load(); }));
  document.querySelectorAll('.stack-legend').forEach(el=>el.addEventListener('click',()=>{ window.__stackHidden=window.__stackHidden||{}; const k=el.dataset.layer; window.__stackHidden[k]=!window.__stackHidden[k]; const p=document.getElementById('stackPanel'); if(p){ const box=p.querySelector('.chart-box'); box.outerHTML=svgStackChart(window.__lineData||[]); bindChartHover(); bindChartClicks(); }}));
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function monthStart() { return todayStr().slice(0, 8) + '01'; }
function lastScanText() {
  if (!lastScanAt) return '最后更新: 暂无';
  const ms = Date.now() - new Date(lastScanAt).getTime();
  const mins = Math.max(0, Math.floor(ms / 60000));
  return '最后更新: ' + (mins < 1 ? '刚刚' : mins + '分钟前');
}
function updateLastScan() {
  const el = document.getElementById('lastScan');
  if (el) el.textContent = lastScanText();
}
setInterval(updateLastScan, 60000);

async function api(url, opts = {}) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { ...(opts.headers || {}) };
  if (token) headers['X-Token'] = token;
  const share = new URLSearchParams(window.location.search).get('token');
  if (share) headers['X-Share-Token'] = share;
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); renderLogin(); throw new Error('未登录'); }
  return res.json();
}

function renderLogin(msg) {
  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="login-mark">Agent<em>Cost</em></div>
      <div class="login-sub">AI Agent 用量与成本</div>
      <div class="login-card">
        <input id="user" placeholder="用户名" autocomplete="username">
        <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
        <button id="btn">登录</button>
        <div class="login-err" id="err">${msg || ''}</div>
      </div>
    </div>`;
  document.getElementById('btn').onclick = doLogin;
  document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pass').value;
  const errEl = document.getElementById('err');
  try {
    const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const d = await r.json();
    if (d.ok) { localStorage.setItem(TOKEN_KEY, d.token); localStorage.setItem(ROLE_KEY, d.role || 'user'); state.role = d.role || 'user'; init(); }
    else errEl.textContent = d.error || '登录失败';
  } catch (e) { errEl.textContent = '网络错误'; }
}

function render(el, d) {
  lastScanAt = d.last_scan || null;
  state.min_ts = d.min_ts || state.min_ts;
  // 模型筛选项随未按模型筛选的汇总结果更新，避免选中后列表缩成单项。
  if (!state.model) state.filters.models = [...new Set(d.by_model.map(m => m.model).filter(Boolean))].sort();
  const t = d.total;
  const days = Math.max(1, Math.round((new Date(d.range.to) - new Date(d.range.from)) / 86400000) + 1);
  const forecast = d.forecast_monthly || {};
  const prev = d.prev || {};
  const prevPct = prev.cost ? ((t.cost - prev.cost) / prev.cost * 100) : null;
  const prevColor = prevPct > 0 ? '#d97757' : '#4a9d6a';
  const cards = [
    { label: 'TOKENS 总量', value: fmtTokens(t.tokens), sub: fmtCost(t.cost) },
    { label: '估算成本', value: fmtCost(t.cost), sub: t.cnt + ' 条记录' },
    { label: '缓存节省', value: t.saved_usd ? fmtCost(t.saved_usd) : '—', sub: '省下的钱' },
    { label: '平均缓存率', value: t.cache_rate != null ? t.cache_rate.toFixed(1) + '%' : '—', sub: t.cr_tokens ? '缓存读 ' + fmtTokens(t.cr_tokens) : '无缓存数据' },
    { label: '日均', value: fmtTokens(t.tokens / days), sub: fmtCost(t.cost / days) + ' / 天' },
    { label: '月底预测', value: forecast.used ? fmtCost(forecast.forecast) : '—', sub: forecast.used ? `已用 ${forecast.days_elapsed} 天 · 日均 ${fmtCost(forecast.avg)}` : '—' },
    { label: '环比', value: prevPct == null ? '—' : `<span style="color:${prevColor}">${prevPct >= 0 ? '+' : ''}${prevPct.toFixed(1)}%</span>`, sub: 'vs 上一段' },
    { label: '所选范围', value: d.range.from.slice(5), sub: '至 ' + d.range.to.slice(5) + ' · ' + days + ' 天' },
  ];
  const budget = state.budget || {};
  const budgetAmount = Number(budget.monthly_budget);
  const budgetCurrency = budget.budget_currency || 'cny';
  const usedCur = (forecast.used || 0) * (getCurrency() === 'cny' ? (state.fx || 7.1) : 1);
  const budgetUsd = budgetCurrency === 'cny' ? budgetAmount / (state.fx || 7.1) : budgetAmount;
  const budgetCur = budgetUsd * (getCurrency() === 'cny' ? (state.fx || 7.1) : 1);
  const budgetPct = budgetCur > 0 ? usedCur / budgetCur * 100 : 0;
  const budgetColor = budgetPct > 100 ? '#c0392b' : budgetPct >= 80 ? '#d97757' : '#4a9d6a';
  const budgetHtml = Number.isFinite(budgetAmount) ? `<div class="panel budget-panel"><div class="budget-head"><h2>本月预算</h2><span class="budget-text">已用 ${fmtCost(forecast.used || 0)} / 预算 ${getCurrency() === 'cny' ? '¥' : '$'}${budgetCur.toFixed(getCurrency() === 'cny' ? 0 : 2)} (${budgetPct.toFixed(1)}%)</span></div><div class="budget-track"><i style="width:${Math.min(budgetPct, 100)}%;background:${budgetColor}"></i></div></div>` : '';
  const agentTags = { codex: 'codex', hermes: 'hermes', claude: 'claude' };
  const byAgentHtml = d.by_agent.map(a => `
    <tr><td><span class="tag tag-${agentTags[a.agent] || 'codex'}">${a.agent}</span></td>

function bindToolbar() {
  document.getElementById('from').onchange = () => { state.records_offset = 0; load(); };
  document.getElementById('to').onchange = () => { state.records_offset = 0; load(); };
  const logout = document.getElementById('logout');
  if (logout) logout.onclick = () => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(ROLE_KEY); state.role = ''; state.user = ''; renderLogin(); };
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.onclick = () => {
    const q = new URLSearchParams();
    if (state.from) q.set('from', state.from);
    if (state.to) q.set('to', state.to);
    // 带 token 下载
    fetch('api/export?' + q.toString(), { headers: { 'X-Token': localStorage.getItem(TOKEN_KEY) } })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `agentcost_${state.from || 'all'}_to_${state.to || 'all'}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      })
      .catch(e => alert('导出失败: ' + e.message));
  };
  const settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) settingsBtn.onclick = openSettings;
  document.getElementById('curSel').onchange = (e) => {
    setCurrency(e.target.value);
    load();
  };
  document.getElementById('filterAgent').onchange = (e) => { state.agent = e.target.value; state.records_offset = 0; load(); };
  const filterUser = document.getElementById('filterUser');
  if (filterUser) filterUser.onchange = (e) => { state.user = e.target.value; state.records_offset = 0; load(); };
  document.getElementById('filterUp').onchange = (e) => { state.upstream = e.target.value; state.records_offset = 0; load(); };
  document.getElementById('filterModel').onchange = (e) => { state.model = e.target.value; state.records_offset = 0; load(); };
  document.getElementById('filterProject').onchange = (e) => { state.cwd = e.target.value; state.records_offset = 0; load(); };
  document.querySelectorAll('.model-link').forEach(button => {
    button.onclick = () => {
      state.model = button.dataset.model;
      state.records_offset = 0;
      const select = document.getElementById('filterModel');
      if (select) select.value = state.model;
      load();
    };
  });
  document.querySelectorAll('.project-link').forEach(button => {
    button.onclick = () => { state.cwd = button.dataset.cwd; state.records_offset = 0; load(); };
  });
  document.getElementById('recordsPrev').onclick = () => { state.records_offset = Math.max(0, state.records_offset - 100); load(); };
  document.getElementById('recordsNext').onclick = () => { state.records_offset += 100; load(); };
  document.querySelectorAll('.quick button').forEach(b => {
    b.onclick = () => {
      const f = document.getElementById('from'); const t = document.getElementById('to');
      if (b.dataset.days) { f.value = daysAgo(+b.dataset.days); t.value = todayStr(); }
      if (b.dataset.month) { f.value = monthStart(); t.value = todayStr(); }
      if (b.dataset.all) { f.value = state.min_ts || '2026-01-01'; t.value = todayStr(); }
      state.records_offset = 0; load();
    };
  });
}

async function load() {
  const el = document.getElementById('root');
  const f = document.getElementById('from'); const t = document.getElementById('to');
  state.from = f ? f.value : state.from; state.to = t ? t.value : state.to;
  const filterAgent = document.getElementById('filterAgent');
  const filterUp = document.getElementById('filterUp');
  const filterModel = document.getElementById('filterModel');
  const filterUser = document.getElementById('filterUser');
  const filterProject = document.getElementById('filterProject');
  state.agent = filterAgent ? filterAgent.value : state.agent;
  state.upstream = filterUp ? filterUp.value : state.upstream;
  state.model = filterModel ? filterModel.value : state.model;
  state.user = filterUser ? filterUser.value : state.user;
  state.cwd = filterProject ? filterProject.value : state.cwd;
  try {
    const q = new URLSearchParams();
    if (state.from) q.set('from', state.from);
    if (state.to) q.set('to', state.to);
    if (state.agent) q.set('agent', state.agent);
    if (state.upstream) q.set('upstream', state.upstream);
    if (state.model) q.set('model', state.model);
    if (state.cwd) q.set('cwd', state.cwd);
    if (state.role === 'admin' && state.user) q.set('user', state.user);
    const recordsQ = new URLSearchParams(q);
    recordsQ.set('limit', '100'); recordsQ.set('offset', String(state.records_offset || 0));
    const requests = [api('api/summary?' + q.toString()), api('api/records?' + recordsQ.toString())];
    if (!state.readonly) requests.push(api('api/config'));
    const [d, recordsResp, cfgResp] = await Promise.all(requests);
    if (!d.ok) throw new Error(d.error || '加载失败');
    if (!recordsResp.ok) throw new Error(recordsResp.error || '加载明细失败');
    d.records = recordsResp;
    state.fx = d.fx || state.fx;
    state.budget = (cfgResp && cfgResp.config) || state.budget || {};
    render(el, d);
  } catch (e) { if (e.message !== '未登录') el.innerHTML = '<div class="err-msg">加载失败: ' + e.message + '</div>'; }
}

async function loadFilters() {
  const r = await api('api/filters');
  if (!r.ok) throw new Error(r.error || '加载筛选项失败');
  state.filters = { agents: r.agents || [], upstreams: r.upstreams || [], models: state.filters.models || [], projects: r.projects || [], users: r.users || [] };
}

        <div class="hint">仅周报生效；日报每天按推送时间发送</div></div>
      <div class="field"><label>数据接入 Key</label>
        <input type="text" id="cfgIngestKey" value="${cfg.ingest_key || ''}" placeholder="留空=仅允许登录 Token">
        <div class="hint">调用 POST /api/ingest 时可通过 X-Ingest-Key 认证</div></div>
      <div class="field" style="border-top:1px solid var(--line);padding-top:16px"><label>模型价格管理</label>
        <div style="display:flex;align-items:center;gap:10px"><span class="hint" id="officialPriceUpdated">官方价格：最后更新 ${escHtml(officialUpdated)}${officialPrices.count ? `（${officialPrices.count} 个本地模型匹配）` : ''}</span><button id="cfgFetchOfficial">立即更新官方价格</button></div>
        <div class="hint">官方基础价来自 OpenRouter，按既有上游倍率计算；手动价格覆盖优先。</div></div>
      <div class="field" style="border-top:1px solid var(--line);padding-top:16px"><label>只读分享</label>
        <div class="hint">${cfg.share_enabled ? '已启用：任何拿到链接的人可只读查看，无修改权限' : '未启用'}</div>
        <div style="display:flex;gap:8px;margin-top:8px"><input id="shareUrl" type="text" readonly value="${cfg.share_enabled && cfg.share_token ? location.origin + '/share/?token=' + cfg.share_token : ''}" placeholder="生成后显示分享链接" style="flex:1"><button id="shareCreate">生成链接</button><button id="shareCopy">复制</button><button id="shareRevoke">撤销</button></div></div>
      ${state.role === 'admin' && !state.readonly ? `<div class="field" style="border-top:1px solid var(--line);padding-top:16px"><label>用户管理</label>
        <div class="scroll-box" style="max-height:160px"><table><tr><th>用户名</th><th>角色</th><th></th></tr>${users.map(u => `<tr><td>${escHtml(u.username)}</td><td>${escHtml(u.role)}</td><td><button class="m-del user-del" data-username="${escHtml(u.username)}">删除</button></td></tr>`).join('') || '<tr><td colspan="3" class="muted">暂无用户</td></tr>'}</table></div>
        <div class="row" style="margin-top:12px"><div class="field"><label>用户名</label><input type="text" id="newUsername" autocomplete="off"></div><div class="field"><label>密码</label><input type="password" id="newPassword" autocomplete="new-password"></div><div class="field"><label>角色</label><select id="newRole"><option value="user">user</option><option value="admin">admin</option></select></div></div>
        <button id="userAdd">添加用户</button><div class="hint" id="userStatus"></div></div>` : ''}
      <div class="status" id="cfgStatus"></div>
      <div class="actions">
        <button id="cfgModels">📦 模型价格管理</button>
        <button id="cfgTest">测试通知</button>
        <button id="cfgCancel">取消</button>
        <button class="primary" id="cfgSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  document.getElementById('cfgCancel').onclick = () => mask.remove();
  document.getElementById('cfgModels').onclick = () => openModelsManager();
  document.getElementById('cfgFetchOfficial').onclick = async () => {
    const button = document.getElementById('cfgFetchOfficial');
    const st = document.getElementById('cfgStatus');
    button.disabled = true;
    st.className = 'status'; st.textContent = '正在更新官方价格...';
    try {
      const r = await api('api/prices/fetch', { method: 'POST' });
      if (!r.ok) throw new Error(r.error || '更新失败');
      await loadFilters();
      load();
      const updated = r.fetched_at ? new Date(r.fetched_at).toLocaleString() : '刚刚';
      document.getElementById('officialPriceUpdated').textContent = `官方价格：最后更新 ${updated}`;
      st.className = 'status ok'; st.textContent = `✅ 已更新 ${r.fetched} 个官方模型价格，模型列表已刷新`;
    } catch (e) {
      st.className = 'status err'; st.textContent = '❌ ' + e.message;
    } finally { button.disabled = false; }
  };
  document.getElementById('cfgTest').onclick = async () => {
    const st = document.getElementById('cfgStatus');
    st.className = 'status'; st.textContent = '发送中...';
    const r = await api('api/test-webhook', { method: 'POST' });
    if (r.sent) { st.className = 'status ok'; st.textContent = '✅ 通知已发送，请查收'; }
    else { st.className = 'status err'; st.textContent = '❌ ' + (r.error || '发送失败'); }
  };
  document.getElementById('shareCreate').onclick = async () => {
    const r = await api('api/share/create');
    if (r.ok) document.getElementById('shareUrl').value = location.origin + r.share_url;
  };
  document.getElementById('shareCopy').onclick = async () => {
    const v = document.getElementById('shareUrl').value; if (v) await navigator.clipboard.writeText(v);
  };
  document.getElementById('shareRevoke').onclick = async () => { await api('api/share/revoke'); document.getElementById('shareUrl').value = ''; };
  const userStatus = document.getElementById('userStatus');
  const showUserStatus = (message, isError = false) => { if (userStatus) { userStatus.textContent = message; userStatus.style.color = isError ? '#c0392b' : '#3f8a5a'; } };
  const userAdd = document.getElementById('userAdd');
  if (userAdd) userAdd.onclick = async () => {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;
    if (!username || !password) { showUserStatus('请输入用户名和密码', true); return; }
    try {
      const r = await api('api/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, role }) });
      if (!r.ok) { showUserStatus(r.error || '添加失败', true); return; }
      mask.remove(); await loadFilters(); openSettings();
    } catch (e) { showUserStatus(e.message, true); }
  };
  mask.querySelectorAll('.user-del').forEach(btn => btn.onclick = async () => {
    const username = btn.dataset.username;
    if (!confirm(`确定删除用户「${username}」吗？`)) return;
    try {
      const r = await api('api/users?username=' + encodeURIComponent(username), { method: 'DELETE' });
      if (!r.ok) { showUserStatus(r.error || '删除失败', true); return; }
      mask.remove(); await loadFilters(); openSettings();
    } catch (e) { showUserStatus(e.message, true); }
  });
  document.getElementById('cfgSave').onclick = async () => {
    const st = document.getElementById('cfgStatus');
    const payload = {
      monthly_budget: parseFloat(document.getElementById('cfgBudget').value) || 2000,
      budget_currency: document.getElementById('cfgCur').value,
      alert_threshold: (parseFloat(document.getElementById('cfgThreshold').value) || 80) / 100,
      notify_cooldown_hours: parseInt(document.getElementById('cfgCooldown').value) || 12,
      anomaly_enabled: document.getElementById('cfgAnomalyEnabled').checked,
      anomaly_multiplier: Math.max(1.5, parseFloat(document.getElementById('cfgAnomalyMultiplier').value) || 3.0),
      webhook_type: document.getElementById('cfgWtype').value,
      webhook_url: document.getElementById('cfgWurl').value.trim(),
      webhook_enabled: document.getElementById('cfgWenabled').checked,
      report_enabled: document.getElementById('cfgReportEnabled').checked,
      report_type: document.getElementById('cfgReportType').value,
      report_time: document.getElementById('cfgReportTime').value || '09:00',
      report_weekday: parseInt(document.getElementById('cfgReportWeekday').value, 10) || 1,
      ingest_key: document.getElementById('cfgIngestKey').value.trim(),
    };
    try {
      const r = await api('api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (r.ok) { st.className = 'status ok'; st.textContent = '✅ 已保存'; setTimeout(() => mask.remove(), 800); }
      else { st.className = 'status err'; st.textContent = '❌ ' + (r.error || '保存失败'); }
    } catch (e) { st.className = 'status err'; st.textContent = '❌ ' + e.message; }
  };
}

/* ---------- 模型价格管理弹窗 ---------- */
async function openModelsManager() {
  let data = { models: [], overrides: {} };
  try {
    const r = await api('api/models');
    if (r.ok) data = r;
  } catch (e) { /* ignore */ }
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const fx = state.fx || 7.1;
  const rows = data.models.map(m => {
    const ovr = data.overrides[m.model] || data.overrides[m.model.split('/').pop()] || {};
    const up = ovr.upstream || m.upstream || '';
    const pi = ovr.price_in !== undefined ? ovr.price_in : (m.price_in !== undefined ? m.price_in : '');
    const po = ovr.price_out !== undefined ? ovr.price_out : (m.price_out !== undefined ? m.price_out : '');
    // 缓存价格：优先 override，其次自动计算展示
    let cpi = ovr.cache_price_in !== undefined ? ovr.cache_price_in : '';
    let cpw = ovr.cache_price_write !== undefined ? ovr.cache_price_write : '';
    if (cpi === '' && m.price_in) cpi = Math.round(m.price_in * 0.1 * 10000) / 10000;
    if (cpw === '' && m.price_in) cpw = Math.round(m.price_in * 1.25 * 10000) / 10000;
    return `<tr>
      <td style="width:24%">${m.model}</td>
      <td><input class="m-up" value="${up}" placeholder="自动"></td>
      <td><input class="m-pi num" type="number" step="0.001" value="${pi}" placeholder="自动"></td>
      <td><input class="m-po num" type="number" step="0.001" value="${po}" placeholder="自动"></td>
      <td><input class="m-cpi num" type="number" step="0.001" value="${cpi}" placeholder="×0.1"></td>
      <td><input class="m-cpw num" type="number" step="0.001" value="${cpw}" placeholder="×1.25"></td>
      <td style="width:6%"><button class="m-del">✕</button></td>
    </tr>`;
  }).join('');
  mask.innerHTML = `
    <div class="modal" style="width:720px">
      <h3>模型价格管理</h3>
      <div class="hint" style="margin-bottom:12px">修改上游名称、输入/输出价、缓存读/写价（USD/百万token），留空则用自动识别。保存后立即生效。</div>
      <div class="scroll-box" style="max-height:50vh">
        <table>
          <tr><th>模型</th><th>上游</th><th>输入价</th><th>输出价</th><th>缓存读价</th><th>缓存写价</th><th></th></tr>
          ${rows || '<tr><td colspan="7" class="muted">暂无模型数据</td></tr>'}
        </table>
      </div>
      <div class="status" id="mStatus"></div>
      <div class="actions">
        <button id="mCancel">关闭</button>
        <button class="primary" id="mSave">保存全部</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  document.getElementById('mCancel').onclick = () => mask.remove();
  // 删除行
  mask.querySelectorAll('.m-del').forEach(btn => {
    btn.onclick = () => {
      const tr = btn.closest('tr');
      const model = tr.querySelector('td').textContent;
      // 标记删除：把字段清空并禁用（保存时清空=删除覆盖）
      tr.querySelectorAll('input').forEach(i => { i.value = ''; i.dataset.clear = '1'; });
      btn.textContent = '✓';
      btn.style.color = '#3f8a5a';
    };
  });
  document.getElementById('mSave').onclick = async () => {
    const st = document.getElementById('mStatus');
    st.className = 'status'; st.textContent = '保存中...';
    const trs = mask.querySelectorAll('.modal table tr');
    let saved = 0, errors = 0;
    for (const tr of trs) {
      const model = tr.querySelector('td')?.textContent;
      if (!model || !model.includes('.')) continue;
      const inputs = tr.querySelectorAll('input');
      const up = inputs[0].value.trim();
      const piRaw = inputs[1].value.trim();
      const poRaw = inputs[2].value.trim();
      const cpiRaw = inputs[3].value.trim();
      const cpwRaw = inputs[4].value.trim();
      const clear = inputs[0].dataset.clear === '1';
      const payload = { model };
      if (clear) { /* 空覆盖删除 */ } else {
        if (up) payload.upstream = up;
        if (piRaw !== '' && poRaw !== '') {
          const pi = parseFloat(piRaw), po = parseFloat(poRaw);
          if (!isNaN(pi) && !isNaN(po)) { payload.price_in = pi; payload.price_out = po; }
        }
        if (cpiRaw !== '' || cpwRaw !== '') {
          if (cpiRaw !== '') { const cpi = parseFloat(cpiRaw); if (!isNaN(cpi)) payload.cache_price_in = cpi; }
          if (cpwRaw !== '') { const cpw = parseFloat(cpwRaw); if (!isNaN(cpw)) payload.cache_price_write = cpw; }
        }
      }
      try {
        const r = await api('api/models', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (r.ok) saved++; else errors++;
      } catch (e) { errors++; }
    }
    if (errors === 0) { st.className = 'status ok'; st.textContent = `✅ 已保存 ${saved} 个模型，价格已更新`; setTimeout(() => { mask.remove(); load(); }, 900); }
    else { st.className = 'status err'; st.textContent = `⚠️ 成功 ${saved}，失败 ${errors}`; }
  };
}

async function init() {
  const token = localStorage.getItem(TOKEN_KEY);
  const share = new URLSearchParams(window.location.search).get('token');
  state.readonly = !token && !!share;
  state.role = state.readonly ? '' : (localStorage.getItem(ROLE_KEY) || state.role || 'user');
  if (!token && !share) { renderLogin(); return; }
  document.getElementById('root').innerHTML = '<div id="loading">加载中...</div>';
  try { await loadFilters(); } catch (e) { if (e.message === '未登录') return; }
  load();
}
init();
</script>
